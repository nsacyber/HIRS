# Updated: 10/26/2026
name: HIRS build and packages for Linux
on:
  pull_request:
    branches:
      - 'development'
      - 'main'
  workflow_dispatch:

jobs:
  # run the package script for HIRS ACA, Provisioners, tcg_rim_tool, and tcg_eventlog_tool
  Package_linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: directory setup
        run: |
          mkdir -p artifacts/jars
          mkdir -p artifacts/win
          mkdir -p artifacts/win/hirstools
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git curl nano cron mariadb-server
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Gradle build
        run: |
          ./gradlew clean;
          ./gradlew build;
          ./gradlew bootWar;
          ./gradlew release;
          ./gradlew buildZip
          cp HIRS_AttestationCAPortal/build/libs/*.jar artifacts/jars/. 
          cp HIRS_AttestationCA/build/libs/*.jar artifacts/jars/.
          cp HIRS_Utils/build/libs/*.jar artifacts/jars/.
          cp tools/tcg_rim_tool/build/distributions/*.zip artifacts/win
          cp tools/tcg_eventlog_tool/build/distributions/*.zip artifacts/win
          cp package/win/tcg-rim-tool/* artifacts/win/hirstools
      - name: Archive RPM files
        uses: actions/upload-artifact@v5
        with:
          name: RPM_Files
          path: |
            HIRS_AttestationCAPortal/build/distributions/*.rpm
            HIRS_Provisioner.NET/build/distributions/*.rpm
            tools/tcg_rim_tool/build/distributions/*.rpm
            tools/tcg_eventlog_tool/build/distributions/*.rpm
          if-no-files-found: error
      - name: Archive DEB files
        uses: actions/upload-artifact@v5
        with:
          name: DEB_Files
          path: |
            HIRS_AttestationCAPortal/build/distributions/*.deb
            HIRS_Provisioner.NET/build/distributions/*.deb
          if-no-files-found: error
      - name: War files
        uses: actions/upload-artifact@v5
        with:
          name: WAR_Files
          path: HIRS_AttestationCAPortal/build/libs/HIRS_AttestationCAPortal.war
          if-no-files-found: error
      - name: JAR_Files
        uses: actions/upload-artifact@v5
        with:
          name: JAR_Files
          path: artifacts/jars/
          if-no-files-found: error
      - name: ZIP_Files
        uses: actions/upload-artifact@v5
        with:
          name: ZIP_Files
          path: artifacts/win/
          if-no-files-found: error

  # install the provisioner packages on clean OS images, without the .NET SDK, and check that it runs
  Package_install:
    needs: Package_linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            artifact: DEB_Files
            install: apt-get update -qq && apt-get install -y -qq ./*.deb
          - image: rockylinux/rockylinux:9.8
            artifact: RPM_Files
            install: dnf install -y ./*.rpm

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install on ${{ matrix.image }} and run --help
        run: |
          docker run --rm -v "$PWD/dist:/dist" -w /dist/HIRS_Provisioner.NET/build/distributions ${{ matrix.image }} bash -c '
            set -e
            ${{ matrix.install }}
            cd /tmp
            tpm_aca_provision --help > help.txt 2>&1 || { cat help.txt; echo "tpm_aca_provision --help failed"; exit 1; }
            cat help.txt
            grep -q -- "--tcp" help.txt
          '