# Updated: 02/03/2026
name: HIRS build and packages for Linux
on:
  push:
    branches:
      - 'development'
      - 'main'
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
            - '!**/*.md'       # all Markdown files
            - '!**/*.png'      # all PNG images
            - '!**/*.jpg'      # all JPG images
            - '!mkdocs.yml'    # the MkDocs config
            - '**'
  # run the package script for HIRS ACA, Provisioners, tcg_rim_tool, and tcg_eventlog_tool
  Package_linux:
    needs: check-changes
    # Run if code changes exist OR if triggered manually
    if: ${{ needs.check-changes.outputs.code_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: directory setup
        run: |
          mkdir -p artifacts/jars
          mkdir -p artifacts/win
          mkdir -p artifacts/win/hirstools
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git curl nano cron mariadb-server
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Gradle build
        run: |
          ./gradlew build;
          ./gradlew bootWar;
          ./gradlew buildDeb;
          ./gradlew buildRpm;
          ./gradlew buildZip
          cp HIRS_AttestationCAPortal/build/libs/*.jar artifacts/jars/. 
          cp HIRS_AttestationCA/build/libs/*.jar artifacts/jars/.
          cp HIRS_Utils/build/libs/*.jar artifacts/jars/.
          cp tools/tcg_rim_tool/build/distributions/*.zip artifacts/win
          cp tools/tcg_eventlog_tool/build/distributions/*.zip artifacts/win
          cp package/win/tcg-rim-tool/* artifacts/win/hirstools
      - name: Archive RPM files
        uses: actions/upload-artifact@v5
        with:
          name: RPM_Files
          path: |
            HIRS_AttestationCAPortal/build/distributions/*.rpm
            tools/tcg_rim_tool/build/distributions/*.rpm
            tools/tcg_eventlog_tool/build/distributions/*.rpm
          if-no-files-found: error
      - name: Archive DEB files
        uses: actions/upload-artifact@v5
        with:
          name: DEB_Files
          path: HIRS_AttestationCAPortal/build/distributions/*.deb
          if-no-files-found: error
      - name: War files
        uses: actions/upload-artifact@v5
        with:
          name: WAR_Files
          path: HIRS_AttestationCAPortal/build/libs/HIRS_AttestationCAPortal.war
          if-no-files-found: error
      - name: JAR_Files
        uses: actions/upload-artifact@v5
        with:
          name: JAR_Files
          path: artifacts/jars/
          if-no-files-found: error
      - name: ZIP_Files
        uses: actions/upload-artifact@v5
        with:
          name: ZIP_Files
          path: artifacts/win/
          if-no-files-found: error

        
