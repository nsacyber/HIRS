name: HIRS Release Assets

on:
  release:
    types: [published]

jobs:
  release-assets:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore HIRS_Provisioner.NET/hirs/HIRS_Provisioner.NET.csproj

      - name: Build release assets
        shell: pwsh
        run: |
          ./gradlew.bat clean release `
            :tools:tcg_eventlog_tool:buildRpm `
            :tools:tcg_eventlog_tool:buildDeb

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets

          Copy-Item HIRS_AttestationCAPortal/build/distributions/*.rpm release-assets/
          Copy-Item HIRS_AttestationCAPortal/build/distributions/*.deb release-assets/

          Copy-Item HIRS_Provisioner.NET/build/distributions/*.rpm release-assets/
          Copy-Item HIRS_Provisioner.NET/build/distributions/*.deb release-assets/
          Copy-Item HIRS_Provisioner.NET/build/distributions/*.msi release-assets/

          Copy-Item tools/tcg_eventlog_tool/build/distributions/*.rpm release-assets/
          Copy-Item tools/tcg_eventlog_tool/build/distributions/*.deb release-assets/

      - name: Verify release assets
        shell: pwsh
        run: |
          $rpms = @(Get-ChildItem release-assets/*.rpm)
          $debs = @(Get-ChildItem release-assets/*.deb)
          $msis = @(Get-ChildItem release-assets/*.msi)

          if ($rpms.Count -ne 3 -or
              $debs.Count -ne 3 -or
              $msis.Count -ne 1) {
            Get-ChildItem release-assets
            throw "Expected 3 RPMs, 3 DEBs, and 1 MSI."
          }

          Write-Host "All expected release assets are present."
          Get-ChildItem release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
