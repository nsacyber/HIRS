# workflow is used to run RIM tests
# Updated: 02/03/2026
name: RIM Test
on:
  push:
    branches:
      - 'development'
      - 'main'
  workflow_dispatch:
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
            - '!**/*.md'       # all Markdown files
            - '!**/*.png'      # all PNG images
            - '!**/*.jpg'      # all JPG images
            - '!mkdocs.yml'    # the MkDocs config
            - '**'
  tcg_rim_tool_tests:
    needs: check-changes
    # Run if code changes exist OR if triggered manually
    if: ${{ needs.check-changes.outputs.code_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git curl nano cron mariadb-server
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Gradle build
        run: |
          ./gradlew build;
          ./gradlew buildDeb;
      - name: install rim tool
        run: |
          sudo dpkg -i tools/tcg_rim_tool/build/distributions/tcg-rim-tool*.deb
      - name: RIM tests
        run: |
          ./.ci/tcg-rim-tool/scripts/run_all_tests.sh --verbose




