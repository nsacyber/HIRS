# HAT on Linux.
#
# The ACA database lives inside the aca container. Re-creating that container (for example
# "docker compose up" after editing this file, or "docker compose down") erases the trust
# certificates, the policy and all reports.

services:
  aca:
    image: ghcr.io/nsacyber/hirs/aca
    container_name: aca
    restart: unless-stopped
    ports:
      - 8443:8443
    networks:
      hat_network:
        ipv4_address: 172.16.1.75
      default:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  hat:
    image: ghcr.io/nsacyber/hirs/hat
    container_name: hat
    privileged: true
    restart: unless-stopped
    ports:
       - 53:53/tcp
       - 53:53/udp
       - 67:67/udp
       - 68:68/udp
       - 69:69
       - 80:80
    networks:
      hat_network:
        ipv4_address: 172.16.1.3
    # "healthy" means the PXE file server is really answering, not just that the process exists.
    # Docker only reports this status; it does not restart an unhealthy container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://172.16.1.3/grub.cfg', timeout=5)"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  hat_network:
    driver: macvlan
    name: hat_network
    driver_opts:
      # The wired interface that goes to the devices under test (a name from "ip link").
      # Override without editing this file:  HAT_PARENT_INTERFACE=enp3s0 docker compose -f <this file> up -d
      parent: "${HAT_PARENT_INTERFACE:-eno2}"
    ipam:
      config:
        - subnet: 172.16.1.0/24
          gateway: 172.16.1.1
