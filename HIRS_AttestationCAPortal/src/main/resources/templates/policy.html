<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/policy.css}" />
    <title th:text="'Attestation Identity CA Policy Settings'">Attestation Identity CA Policy Settings</title>
</head>

<body>
    <h1 layout:fragment="pageHeaderTitle"> Attestation Identity CA Policy Settings </h1>
    <section layout:fragment="content">
        <form th:action="@{/HIRS_AttestationCAPortal/portal/policy/save}" th:object="${policySettings}" method="post">
            <div class="form-check form-switch mb-2">
                <div class="form-row">
                    <input class="form-check-input"
                           type="checkbox"
                           role="switch"
                           id="ecValidation"
                           th:field="*{ecValidationEnabled}"/>
                    <label class="form-check-label" for="ecValidation">
                        Endorsement Certificate Validation
                    </label>
                </div>
                <div class="form-row">
                    <input class="form-check-input"
                           type="checkbox"
                           role="slider"
                           id="pcValidation"
                           th:field="*{pcValidationEnabled}"/>
                    <label class="form-check-label" for="pcValidation">
                        Platform Certificate Validation
                    </label>
                </div>
                <div class="form-row">
                    <input class="form-check-input"
                           type="checkbox"
                           role="switch"
                           id="fwValidation"
                           th:field="*{firmwareValidationEnabled}"/>
                    <label class="form-check-label" for="fwValidation">
                        Firmware Validation
                    </label>
                </div>
            </div><!--form-check form-switch-->
            <button type="submit">Save Settings</button>
        </form>
    </section>
</body>

</html>
