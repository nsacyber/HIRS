plugins {
    id 'com.google.protobuf' version '0.9.6'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation project(':HIRS_Utils')

    implementation libs.bouncycastle
    implementation libs.commons.codec
    implementation libs.commons.lang3
    implementation libs.guava
    implementation libs.hibernate.core
    implementation libs.jackson.core
    implementation libs.jackson.databind
    implementation libs.jakarta.persistence.api
    implementation libs.jakarta.xml
    implementation libs.slf4j.api
    implementation libs.minimal.json
    implementation libs.pci
    implementation libs.protobuf.java
    implementation libs.protobuf.java.util
    // This module uses Spring APIs, but the portal owns application runtime wiring.
    implementation platform(libs.spring.boot.dependencies)
    implementation libs.spring.boot.actuator
    implementation libs.spring.context
    implementation libs.spring.data.jpa
    implementation libs.spring.web

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    compileOnly libs.spotbugs.annotations
    annotationProcessor libs.spotbugs.annotations

    testImplementation libs.commons.io
    testImplementation libs.mockito.core
    testRuntimeOnly libs.slf4j.simple
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc::4.35.0'
    }
}

sourceSets {
    main {
        proto {
            srcDir '../HIRS_Provisioner.NET/hirs/Resources'
        }
    }
}
